plugins { id 'com.android.application' }
android {
    namespace 'com.codepdbh.armymenrts'
    compileSdk 35
    ndkVersion '28.2.13676358'
    defaultConfig {
        applicationId 'com.codepdbh.armymenrts'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '0.2.0-bootstrap'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static',
            '-DAMRTS_LINK_GUEST=' + (project.hasProperty('amrtsLinkGuest') ? 'ON' : 'OFF') } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
}
