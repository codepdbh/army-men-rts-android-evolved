plugins { id 'com.android.application' }
android {
    namespace 'com.codepdbh.armymenrts'
    compileSdk 35
    ndkVersion '28.2.13676358'
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    defaultConfig {
        applicationId 'com.codepdbh.armymenrts'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '0.4.0'
        testInstrumentationRunner 'com.codepdbh.armymenrts.TouchInstrumentation'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static',
            '-DAMRTS_LINK_GUEST=' + (project.hasProperty('amrtsLinkGuest') ? 'ON' : 'OFF'),
            '-DAMRTS_GUEST_OPTIMIZATION=' + (project.hasProperty('amrtsOptimizeGuest') ? '-O2' : '-O0') } }
    }
    externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.30.5' } }
}
